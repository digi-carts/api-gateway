name: Build & Deploy (Dev)
on:
  push:
    branches: [stage]
env:
  REGION: us-east1
  IMAGE: us-east1-docker.pkg.dev/digi-carts-dev/digi-cart/digi-cart-api-gateway
  SERVICE: digi-cart-api-gateway-dev
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Run unit tests
        run: mvn -B test
  build-deploy:
    needs: test

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_DEV_SA_KEY }}
      - uses: google-github-actions/setup-gcloud@v2
      - run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}-dev:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Deploy to Cloud Run (dev)
        run: |
          SERVICE_MONITOR_URL=$(gcloud run services describe digi-cart-service-monitor-dev \
            --region ${{ env.REGION }} \
            --project digi-carts-dev \
            --format='value(status.url)' 2>/dev/null || echo "")
          EXTRA_ENV=""
          if [ -n "$SERVICE_MONITOR_URL" ]; then
            EXTRA_ENV="--update-env-vars SERVICE_MONITOR_URL=${SERVICE_MONITOR_URL}"
          fi
          gcloud run services update ${{ env.SERVICE }} \
            --region ${{ env.REGION }} \
            --image ${{ env.IMAGE }}-dev:latest \
            $EXTRA_ENV \
            --quiet
